<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Produkt hinzufügen</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-input
        label-placement="stacked"
        label="Produkt suchen"
        placeholder="z. B. Banane"
        [(ngModel)]="searchQuery"
        (keyup.enter)="search()"
      ></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" (click)="search()">Suchen</ion-button>

  @if (isSearching) {
  <p class="ion-padding-top">Suche läuft...</p>
  } @if (results.length > 0) {
  <ion-list>
    @for (product of results; track $index) {
    <ion-item button (click)="selectProduct(product)">
      <ion-label>
        <h3>{{ product.name }}</h3>
        <p>{{ product.calories }} kcal pro 100 g</p>
      </ion-label>
    </ion-item>
    }
  </ion-list>
  } @else if (searchDone) {
  <p class="ion-padding-top">Nichts gefunden.</p>
  }

  <ion-list>
    <ion-item>
      <ion-input
        label-placement="stacked"
        label="Name"
        [(ngModel)]="name"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-select label-placement="stacked" label="Mahlzeit" [(ngModel)]="meal">
        <ion-select-option value="breakfast">Frühstück</ion-select-option>
        <ion-select-option value="lunch">Mittagessen</ion-select-option>
        <ion-select-option value="dinner">Abendessen</ion-select-option>
        <ion-select-option value="snack">Snack</ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-input
        label-placement="stacked"
        label="Menge (g)"
        type="number"
        [(ngModel)]="grams"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label-placement="stacked"
        label="kcal pro 100 g"
        type="number"
        [(ngModel)]="caloriesPer100"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label-placement="stacked"
        label="Eiweiß pro 100 g"
        type="number"
        [(ngModel)]="proteinPer100"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label-placement="stacked"
        label="Fett pro 100 g"
        type="number"
        [(ngModel)]="fatPer100"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label-placement="stacked"
        label="Kohlenhydrate pro 100 g"
        type="number"
        [(ngModel)]="carbsPer100"
      ></ion-input>
    </ion-item>
  </ion-list>

  <ion-button expand="block" (click)="save()">Hinzufügen</ion-button>
</ion-content>
